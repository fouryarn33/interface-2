<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neural Core | AI Interface</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-deep:   #0b0b1a;
  --bg-mid:    #12122a;
  --neuron:    #ff3366;
  --synapse:   #33ccff;
  --axon:      #ffcc00;
  --dendrite:  #9966ff;
  --text:      #ffffff;
  --dim:       rgba(255,255,255,0.7);
}

html, body {
  width: 100%; height: 100%;
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  overflow-x: hidden;
}

.hero {
  min-height: 100vh;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: radial-gradient(ellipse at 30% 50%, #1a1a3a, #0a0a1a);
}

/* Neural background */
.neural-bg {
  position: absolute;
  inset: 0;
  background-image: radial-gradient(circle at 20px 20px, rgba(255, 51, 102, 0.05) 2px, transparent 2px);
  background-size: 40px 40px;
  pointer-events: none;
}

nav {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 60px;
  border-bottom: 1px solid rgba(255, 51, 102, 0.2);
  backdrop-filter: blur(10px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 800;
  font-size: 1.3rem;
}

.logo-icon {
  width: 30px;
  height: 30px;
  background: linear-gradient(135deg, var(--neuron), var(--synapse));
  border-radius: 8px;
  transform: rotate(45deg);
  animation: logoGlow 2s ease-in-out infinite;
}

@keyframes logoGlow {
  0%, 100% { box-shadow: 0 0 20px var(--neuron); }
  50% { box-shadow: 0 0 40px var(--synapse); }
}

.nav-links {
  display: flex;
  gap: 40px;
  list-style: none;
}

.nav-links a {
  text-decoration: none;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--dim);
  transition: 0.3s;
  position: relative;
}

.nav-links a:hover, .nav-links a.active {
  color: var(--neuron);
}

.nav-links a.active::after {
  content: '';
  position: absolute;
  bottom: -5px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--neuron), var(--synapse));
}

.content {
  position: relative;
  z-index: 5;
  flex: 1;
  display: flex;
  align-items: center;
  padding: 20px 60px;
  gap: 60px;
}

.copy {
  flex: 0 0 450px;
}

.copy h1 {
  font-size: clamp(2.5rem, 4.5vw, 4.5rem);
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 20px;
}

.highlight {
  color: var(--neuron);
  text-shadow: 0 0 20px var(--neuron);
}

.copy p {
  color: var(--dim);
  font-size: 1rem;
  line-height: 1.8;
  margin-bottom: 40px;
  max-width: 380px;
}

.cta-row {
  display: flex;
  gap: 16px;
}

.btn {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 0.9rem;
  border: none;
  border-radius: 30px;
  padding: 14px 32px;
  cursor: pointer;
  transition: 0.3s;
  letter-spacing: 0.05em;
}

.btn-primary {
  background: linear-gradient(135deg, var(--neuron), var(--synapse));
  color: #fff;
  box-shadow: 0 0 30px rgba(255, 51, 102, 0.5);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 0 50px rgba(51, 204, 255, 0.6);
}

.btn-outline {
  background: transparent;
  color: var(--neuron);
  border: 2px solid var(--neuron);
}

.btn-outline:hover {
  background: rgba(255, 51, 102, 0.1);
  border-color: var(--synapse);
  color: var(--synapse);
}

/* 3D Neural Network */
.visual {
  flex: 1;
  height: 500px;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.neural-scene {
  width: 500px;
  height: 500px;
  position: relative;
  transform-style: preserve-3d;
  animation: neuralRotate 30s linear infinite;
}

@keyframes neuralRotate {
  from { transform: rotateY(0deg) rotateX(5deg); }
  to { transform: rotateY(360deg) rotateX(5deg); }
}

/* Neuron layers */
.layer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform-style: preserve-3d;
  border-radius: 50%;
}

.layer-1 { width: 100px; height: 100px; animation: layerPulse 3s infinite; }
.layer-2 { width: 200px; height: 200px; animation: layerPulse 4s infinite -1s; }
.layer-3 { width: 300px; height: 300px; animation: layerPulse 5s infinite -2s; }
.layer-4 { width: 400px; height: 400px; animation: layerPulse 6s infinite -3s; }

@keyframes layerPulse {
  0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
  50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
}

/* Neurons */
.neuron {
  position: absolute;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--neuron);
  box-shadow: 0 0 30px var(--neuron);
  transform-style: preserve-3d;
  animation: neuronPulse 2s ease-in-out infinite;
}

@keyframes neuronPulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.8; }
}

/* Synaptic connections */
.synapse {
  position: absolute;
  height: 2px;
  background: linear-gradient(90deg, var(--neuron), var(--synapse));
  transform-origin: 0 0;
  opacity: 0.3;
  animation: synapseGlow 3s ease-in-out infinite;
}

@keyframes synapseGlow {
  0%, 100% { opacity: 0.2; }
  50% { opacity: 0.8; }
}

/* Floating data nodes */
.data-node {
  position: absolute;
  width: 12px;
  height: 12px;
  background: var(--axon);
  border-radius: 50%;
  transform-style: preserve-3d;
  animation: dataFloat 4s ease-in-out infinite;
}

@keyframes dataFloat {
  0%, 100% { transform: translateZ(50px) translateY(0); }
  50% { transform: translateZ(80px) translateY(-20px); }
}

/* AI metrics */
.metrics {
  position: absolute;
  top: 40px;
  right: 40px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 20;
}

.metric-item {
  background: rgba(255, 51, 102, 0.1);
  border: 1px solid rgba(255, 51, 102, 0.3);
  padding: 12px 20px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  display: flex;
  justify-content: space-between;
  gap: 30px;
}

.metric-label {
  font-size: 0.8rem;
  color: var(--dim);
}

.metric-value {
  font-weight: 700;
  color: var(--neuron);
}

/* Responsive */
@media (max-width: 1000px) {
  nav { padding: 20px 30px; }
  .content { flex-direction: column; padding: 20px 30px; }
  .copy { max-width: 100%; flex: unset; }
  .visual { width: 100%; height: 400px; }
  .neural-scene { transform: scale(0.7); }
}
</style>
</head>
<body>
<section class="hero">
  <div class="neural-bg"></div>

  <nav>
    <div class="logo">
      <div class="logo-icon"></div>
      NEURAL<span style="color: var(--neuron);">CORE</span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="active">Network</a></li>
      <li><a href="#">Layers</a></li>
      <li><a href="#">Training</a></li>
      <li><a href="#">Inference</a></li>
    </ul>
  </nav>

  <div class="content">
    <div class="copy">
      <h1>
        <span class="highlight">Neural</span><br>
        Network<br>
        Intelligence
      </h1>
      <p>Deep learning architecture with 175 billion parameters. Real-time inference and training at unprecedented speeds.</p>
      <div class="cta-row">
        <button class="btn btn-primary">Train Model</button>
        <button class="btn btn-outline">View Architecture</button>
      </div>
    </div>

    <div class="visual">
      <div class="neural-scene" id="neuralScene">
        <!-- Layers will be generated by JS -->
      </div>
    </div>
  </div>

  <!-- Metrics -->
  <div class="metrics">
    <div class="metric-item">
      <span class="metric-label">Parameters</span>
      <span class="metric-value">175B</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Layers</span>
      <span class="metric-value">96</span>
    </div>
    <div class="metric-item">
      <span class="metric-label">Accuracy</span>
      <span class="metric-value">99.7%</span>
    </div>
  </div>

  <script>
    const scene = document.getElementById('neuralScene');
    
    // Create neuron layers
    for (let l = 0; l < 4; l++) {
      const layer = document.createElement('div');
      layer.className = `layer layer-${l+1}`;
      layer.style.border = `2px solid rgba(${l === 0 ? '255,51,102' : l === 1 ? '51,204,255' : l === 2 ? '255,204,0' : '153,102,255'}, 0.2)`;
      layer.style.borderRadius = '50%';
      layer.style.position = 'absolute';
      layer.style.top = '50%';
      layer.style.left = '50%';
      scene.appendChild(layer);
    }

    // Create neurons
    const neuronCount = 30;
    for (let i = 0; i < neuronCount; i++) {
      const neuron = document.createElement('div');
      neuron.className = 'neuron';
      
      // Position in 3D space
      const radius = 150 + Math.random() * 100;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      
      const x = radius * Math.sin(phi) * Math.cos(theta);
      const y = radius * Math.sin(phi) * Math.sin(theta);
      const z = radius * Math.cos(phi);
      
      neuron.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
      neuron.style.background = i % 3 === 0 ? 'var(--neuron)' : i % 3 === 1 ? 'var(--synapse)' : 'var(--axon)';
      neuron.style.boxShadow = `0 0 30px currentColor`;
      
      scene.appendChild(neuron);
    }

    // Create synaptic connections
    for (let i = 0; i < 50; i++) {
      const synapse = document.createElement('div');
      synapse.className = 'synapse';
      
      // Random start and end points
      const start = {
        x: (Math.random() - 0.5) * 300,
        y: (Math.random() - 0.5) * 300,
        z: (Math.random() - 0.5) * 300
      };
      
      const end = {
        x: (Math.random() - 0.5) * 300,
        y: (Math.random() - 0.5) * 300,
        z: (Math.random() - 0.5) * 300
      };
      
      const dx = end.x - start.x;
      const dy = end.y - start.y;
      const dz = end.z - start.z;
      const length = Math.sqrt(dx*dx + dy*dy + dz*dz);
      
      synapse.style.width = length + 'px';
      synapse.style.transform = `translate3d(${start.x}px, ${start.y}px, ${start.z}px) rotateX(${Math.atan2(dy, Math.sqrt(dx*dx+dz*dz))}rad) rotateY(${Math.atan2(dz, dx)}rad)`;
      
      scene.appendChild(synapse);
    }

    // Create floating data nodes
    for (let i = 0; i < 20; i++) {
      const node = document.createElement('div');
      node.className = 'data-node';
      
      const angle = (i / 20) * Math.PI * 2;
      const radius = 200;
      
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius * 0.5;
      const z = Math.sin(angle) * radius;
      
      node.style.transform = `translate3d(${x}px, ${y}px, ${z}px)`;
      node.style.animationDelay = `-${i * 0.2}s`;
      
      scene.appendChild(node);
    }
  </script>
</section>
</body>
</html>
